<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Pretendard: 라틴 문자/기호와 한글을 같은 서체로 렌더링해서, Inter에 없는 한글이
         다른 폴백 폰트로 그려지며 화살표(→) 같은 기호 뒤에서 자간이 갑자기 벌어져 보이는
         문제를 막음 -->
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
    <!-- Noto Serif KR: 제목류에서 한글이 나올 때 Newsreader(한글 미지원) 대신
         자연스럽게 폴백되도록 하는 세리프 폰트 -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet">
    <!-- 사용자가 지정한 디자인 시스템 폰트 3종: Newsreader(제목/세리프),
         Work Sans(본문), JetBrains Mono(라벨/메타정보). 셋 다 한글 글리프가 없어서
         한글 텍스트는 자동으로 Pretendard/Noto Serif KR로 폴백됨(라틴/숫자만 이 폰트로 보임) -->
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Work+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <!-- Nanum Gothic Coding: JetBrains Mono엔 한글이 없어서, 라벨류 텍스트에 한글이 나올 때
         일반 폰트로 튀지 않고 계속 "고정폭 느낌"을 유지하도록 쓰는 한글 모노스페이스 폰트 -->
    <link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic+Coding:wght@400;700&display=swap" rel="stylesheet">
    <!-- 다크모드 전용 "Metallic Industrial" 스타일 폰트 2종: Geist(제목), Hanken Grotesk(본문).
         라이트모드는 계속 Newsreader/Work Sans를 쓰고, .dark 스코프에서만 이 폰트로 교체됨
         (index.css 참고). 둘 다 한글 글리프가 없어서 한글은 기존과 동일하게 Pretendard로 폴백 -->
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Study AI - AI로 학습 노트를 기억하고 퀴즈로 복습하세요"
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>Study AI</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <!--
      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      You can add webfonts, meta tags, or analytics to this file.
      The build step will place the bundled scripts into the <body> tag.

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->
  </body>
</html>
