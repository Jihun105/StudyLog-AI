events {}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server {
        listen 80;

        # nginx 기본 업로드 제한이 1MB라, 백엔드가 10MB까지 허용하는 이미지 업로드
        # (노트 이미지 + 프로필 사진)가 여기서 먼저 413으로 막히는 문제가 있었음
        client_max_body_size 15M;

        location /admin/ {
            proxy_pass http://admin:8001;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /django-static/ {
            proxy_pass http://admin:8001;
        }

        # 점검모드 중에도 관리자는 로그인 + 관리자 API를 계속 쓸 수 있어야 대시보드에서
        # 점검모드를 다시 끌 수 있음 - 그래서 이 두 경로는 /api/ 의 점검모드 체크보다
        # 먼저(더 구체적인 prefix라 nginx가 우선 매칭) 항상 백엔드로 통과시킴
        location /api/admin/ {
            proxy_pass http://backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/auth/login {
            proxy_pass http://backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/ {
            # 점검모드 플래그 파일(관리자 대시보드 토글 또는 배포 스크립트가 생성/삭제, 백엔드와
            # 공유 볼륨으로 마운트됨)이 있으면 백엔드까지 가지 않고 바로 503을 응답 - 백엔드가
            # 완전히 죽어있어도(예: DB 마이그레이션 사고) 사용자는 항상 정상적인 점검 응답을 받음
            if (-f /shared/maintenance/ON) {
                return 503;
            }
            error_page 503 = @maintenance_json;

            proxy_pass http://backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;

            # 관리자 대시보드의 "지금 접속 중" 기능이 쓰는 웹소켓(/api/ws/presence)이
            # nginx를 거쳐 통하려면 HTTP 업그레이드 핸드셰이크를 그대로 넘겨줘야 함 -
            # 이게 없으면 브라우저의 웹소켓 연결 요청이 일반 HTTP 요청처럼 처리되면서
            # 조용히 실패하고, 접속 중인 사용자가 있어도 목록에 안 잡힘
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # /api/ 의 점검모드 응답에 JSON 바디 + 올바른 Content-Type을 붙여주기 위한 내부 전용
        # 위치. nginx의 if 블록 안에서는 default_type 같은 지시어를 직접 못 써서 이렇게 분리함
        location @maintenance_json {
            internal;
            default_type application/json;
            return 503 '{"status":"maintenance","message":"점검 중입니다. 잠시 후 다시 시도해주세요."}';
        }

        location / {
            root /usr/share/nginx/html;
            try_files $uri /index.html;
        }
    }
}