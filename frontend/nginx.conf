events {}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server {
        listen 80;

        # nginx 기본 업로드 제한이 1MB라, 백엔드가 10MB까지 허용하는 이미지 업로드
        # (노트 이미지 + 프로필 사진)가 여기서 먼저 413으로 막히는 문제가 있었음
        client_max_body_size 15M;

        location /admin/ {
            proxy_pass http://admin:8001;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /django-static/ {
            proxy_pass http://admin:8001;
        }

        location /api/ {
            proxy_pass http://backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;

            # 관리자 대시보드의 "지금 접속 중" 기능이 쓰는 웹소켓(/api/ws/presence)이
            # nginx를 거쳐 통하려면 HTTP 업그레이드 핸드셰이크를 그대로 넘겨줘야 함 -
            # 이게 없으면 브라우저의 웹소켓 연결 요청이 일반 HTTP 요청처럼 처리되면서
            # 조용히 실패하고, 접속 중인 사용자가 있어도 목록에 안 잡힘
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        location / {
            root /usr/share/nginx/html;
            try_files $uri /index.html;
        }
    }
}