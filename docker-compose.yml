services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage

  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      DATABASE_URL: mysql+aiomysql://root:${MYSQL_ROOT_PASSWORD}@mysql:3306/${MYSQL_DATABASE}
      QDRANT_HOST: qdrant
      # 점검모드 플래그 파일 경로 - frontend(nginx)의 /shared/maintenance 와 같은 호스트
      # 디렉토리를 바라봐야 관리자 대시보드 토글이 nginx 차단에 즉시 반영됨
      MAINTENANCE_FLAG_PATH: /shared/maintenance/ON
    volumes:
      - uploaded_images:/app/uploaded_images
      - ./maintenance:/shared/maintenance
    depends_on:
      mysql:
        condition: service_healthy
      qdrant:
        condition: service_started

  admin:
    build: ./admin
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      DATABASE_URL: mysql+aiomysql://root:${MYSQL_ROOT_PASSWORD}@mysql:3306/${MYSQL_DATABASE}
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./maintenance:/shared/maintenance:ro
    depends_on:
      - backend
      - admin

volumes:
  mysql_data:
  qdrant_data:
  uploaded_images: